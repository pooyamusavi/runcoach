[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runcoach"
version = "0.1.0"
description = "AI running coach: turns free-text training notes and Garmin exports into structured data, insights and evaluated LLM extraction."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pooya Musavi" }]
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.110",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.8"]

[project.scripts]
runcoach = "runcoach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
